# Levanta la base de datos y el servidor juntos.
# Uso: docker compose up --build
#
# La primera vez, o si borraron el volumen, hay que crear las tablas:
#   docker compose run --rm app -reset
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: canchas
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dentro de la red de Docker, la base no se llama "localhost": se
      # llama como el servicio de arriba, "db". Fuera de Docker (go run .
      # en su máquina) sigue siendo "localhost", por eso este valor va
      # aquí y no en el .env que usan para correr sin Docker.
      DATABASE_URL: host=db user=postgres password=postgres dbname=canchas port=5432
      # Secreto: se toma del entorno de quien ejecuta Docker (o de su .env
      # local). No se escribe aquí un valor real.
      CLAVE_FIRMA: ${CLAVE_FIRMA}
      PUERTO: 8080
      TIEMPO_ESPERA_SEGUNDOS: 5
    ports:
      - "8080:8080"

  # Generador de código de sqlc. Vive en el perfil "tools" para que NO se
  # ejecute con "docker compose up": solo corre cuando se le llama.
  # Uso: docker compose run --rm sqlc
  #
  # Monta el proyecto completo porque sqlc necesita leer sqlc.yaml,
  # db/schema.sql y db/consultas.sql, y escribir en internal/almacen/filas/.
  # No depende de PostgreSQL: trabaja con el esquema y las consultas locales.
  sqlc:
    image: sqlc/sqlc:1.31.1
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - .:/src
    # La imagen ya trae /workspace/sqlc como entrypoint; solo faltan los args.
    command: generate

volumes:
  datos_postgres:
