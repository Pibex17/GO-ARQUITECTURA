openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base

info:
  title: ServA · API de reservas de canchas sintéticas
  version: 1.0.0
  summary: Contrato del servidor HTTP real de ServA para el Taller 10.
  description: |
    Contrato OpenAPI 3.1 de los once endpoints implementados en este repositorio.
    Se contrastó con `main.go`, los manejadores, los modelos y el middleware para
    la Fase 5 del Taller 10, no a partir de la documentación antigua. Cuando la
    ficha del Hito 1 y el código difieren, este contrato representa el código que
    realmente se ejecuta.

    ## Envoltura de las respuestas

    Todas las respuestas usan el mismo sobre JSON:

    - Éxito: `{"ok": true, "datos": ...}`. `datos` se omite únicamente cuando el
      valor enviado es `nil`; las operaciones documentadas siempre envían datos.
    - Error: `{"ok": false, "error": {"codigo": "...", "mensaje": "..."}}`.

    ## Serialización

    Los modelos de negocio no tienen etiquetas `json`, así que `encoding/json`
    publica los nombres de los campos Go en PascalCase: `ID`, `CanchaID`,
    `ClienteID`, `HoraInicio`, `PrecioHora`, `AdministradorID`, `Pagos`, etc.
    Los cuerpos de solicitud también usan esos nombres, salvo `POST /login`, que
    usa `usuario` y `clave`, y el detalle de partido, que devuelve un mapa con
    `partido`, `inscriptos` y `cupos_restantes`. No se debe asumir `snake_case`
    en los campos de los modelos.

    ## Autenticación

    `POST /login` es público y devuelve un JWT HS256 de una hora. Las demás rutas
    exigen `Authorization: Bearer <jwt>`. El token lleva `sub` (ID de la cuenta),
    `usuario`, `rol`, `iat` y `exp`; la firma se valida con la clave del entorno y
    el algoritmo se limita a HS256. No se documentan tokens ni claves reales.

    Los roles del negocio son `cliente` y `administrador`. Además de validar el
    token, los manejadores que resuelven el dueño exigen que la cuenta tenga un
    vínculo con un usuario de negocio y que el rol del token, de la cuenta y del
    usuario coincidan. Si no se cumple, responden `403 cuenta_sin_vinculo`.

    ## Códigos globales

    - `404 ruta_inexistente`: cualquier ruta no registrada. Se distingue de
      `404 no_encontrado`, que indica que la ruta existe pero el recurso no.
    - `405 metodo_no_permitido`: la ruta existe, pero el método HTTP no está
      registrado para ella.
    - `500 error_interno`: el middleware de recuperación atrapa un pánico y
      responde sin exponer el detalle. Varias operaciones también pueden devolver
      `500 error_base` ante un fallo de base de datos.

    ## Alcance y planificación

    No se inventaron rutas nuevas. Los once endpoints de `paths` son los que
    existen y se ejecutan. Las entidades del modelo que todavía no tienen
    exposición HTTP y las funcionalidades futuras se documentan en la extensión
    `x-modelo-plan`, cada una marcada `(plan)`; no se agregan a `paths` para no
    presentarlas como operativas.

    Las entidades `Usuario` y `Cuenta` están en `x-modelo-plan` con esquemas
    inline porque no se devuelven por HTTP. Si se agregaran a
    `components/schemas` sin referencias, Redocly emitiría la advertencia
    `no-unused-components`.

    ## Diferencias relevantes con la ficha del Hito 1

    - `PATCH /reservas/{id}/estado` es solo para administrador y la transición
      prohibida responde `422 transicion_invalida`, no `400`.
    - `POST /reservas` no acepta ni documenta `requiere_comprobante`; el servidor
      actual no tiene ese campo. Se lista como `(plan)` en `x-modelo-plan`.
    - Las fechas y horas son cadenas no vacías; el servidor no valida formato,
      solapamiento por `HoraFin` ni calendario.
    - `GET /partidos/{id}` solo exige un token válido: no resuelve el vínculo de
      negocio ni aplica una regla de propiedad.
  license:
    name: Uso académico
    identifier: LicenseRef-Uso-Academico

servers:
  - url: http://127.0.0.1:8080
    description: Servidor local del proyecto (equivale a localhost:8080).

security:
  - bearerAuth: []

tags:
  - name: Sesión
    description: Inicio de sesión y emisión del token.
  - name: Canchas
    description: Catálogo, creación y edición de canchas.
  - name: Reservas
    description: Reservas, pagos asociados y cambios de estado.
  - name: Partidos
    description: Partidos creados a partir de una reserva confirmada.
  - name: Inscripciones
    description: Inscripción de clientes a un partido con código de invitación.

x-modelo-plan:
  descripcion: |
    Entidades del modelo que todavía no tienen exposición HTTP y funcionalidades
    planificadas. Todo lo de esta sección está marcado `(plan)`: no son
    operaciones de `paths` ni deben consumirse como endpoints operativos.
  entidades:
    Usuario:
      descripcion: |
        Entidad del modelo de negocio que ya existe en el código y en la base.
        Su exposición HTTP está planificada `(plan)`: todavía no tiene endpoints
        propios. No se devuelve en las respuestas actuales;
        `Cancha.AdministradorID` y `Reserva.ClienteID` solo guardan la
        referencia por ID.
      esquema:
        type: object
        additionalProperties: false
        required:
          - ID
          - Nombre
          - Email
          - Rol
        properties:
          ID:
            type: integer
            format: int64
            minimum: 1
            description: (plan) Identificador del usuario de negocio.
          Nombre:
            type: string
            description: (plan) Nombre visible del usuario.
          Email:
            type: string
            description: |
              (plan) Correo del usuario. El modelo actual no valida su formato
              ni declara una restricción de unicidad.
          Rol:
            type: string
            enum:
              - cliente
              - administrador
            description: (plan) Rol del usuario de negocio.
    Cuenta:
      descripcion: |
        Entidad interna de autenticación que ya existe en el código y en la
        base. Solo se usa en `POST /login` para validar credenciales y emitir el
        token; su exposición HTTP está planificada `(plan)` y no se devuelve en
        las respuestas actuales. El hash de la contraseña se omite
        deliberadamente y no debe exponerse en ningún esquema público.
      esquema:
        type: object
        additionalProperties: false
        required:
          - ID
          - Usuario
          - Rol
        properties:
          ID:
            type: integer
            format: int64
            minimum: 1
            description: (plan) Identificador de la cuenta.
          Usuario:
            type: string
            description: (plan) Nombre de inicio de sesión; es único.
          Rol:
            type: string
            enum:
              - cliente
              - administrador
            description: (plan) Rol de la cuenta.
          UsuarioID:
            type:
              - integer
              - "null"
            format: int64
            minimum: 1
            description: |
              (plan) Vínculo opcional con el usuario de negocio. Puede ser
              `null` cuando la cuenta no está vinculada.
  funcionalidades_planificadas:
    - nombre: Exposición HTTP de Usuario
      estado: (plan)
      descripcion: |
        (plan) No existen rutas `/usuarios` ni respuestas que devuelvan el
        objeto Usuario completo; solo se referencian sus IDs.
    - nombre: Exposición HTTP de Cuenta
      estado: (plan)
      descripcion: |
        (plan) No existe un CRUD de cuentas ni una respuesta que devuelva una
        Cuenta. `POST /login` solo devuelve el token.
    - nombre: CRUD de horarios
      estado: (plan)
      descripcion: |
        (plan) Los horarios se leen anidados en `GET /canchas`; no hay rutas
        para crearlos, editarlos o eliminarlos.
    - nombre: Reportes de ingresos
      estado: (plan)
      descripcion: |
        (plan) No existe una ruta de reportes ni cálculos de ingresos.
    - nombre: Endpoints propios de pagos
      estado: (plan)
      descripcion: |
        (plan) Los pagos se crean o actualizan como efecto de
        `PATCH /reservas/{id}/estado`; no hay rutas `/pagos`.
  campos_planificados:
    - entidad: Usuario
      campo: Telefono
      estado: (plan)
      descripcion: |
        (plan) Aparece en la ficha del negocio, pero no existe en
        `internal/usuarios/modelos.go` ni se devuelve por HTTP.
    - entidad: Usuario
      campo: ContrasenaHash
      estado: (plan)
      descripcion: |
        (plan) Aparece en la ficha del negocio, pero no existe en el modelo
        actual. Es un dato interno y no debe exponerse en respuestas públicas.
    - entidad: Usuario
      campo: CreadoEn
      estado: (plan)
      descripcion: |
        (plan) Aparece en la ficha del negocio, pero no existe en el modelo
        actual.
    - entidad: Reserva
      campo: RequiereComprobante
      estado: (plan)
      descripcion: |
        (plan) Aparece en la ficha del negocio, pero el servidor no lo acepta
        ni lo devuelve. `POST /reservas` no lo recibe.
    - entidad: Reserva
      campo: CreadoEn
      estado: (plan)
      descripcion: |
        (plan) Aparece en la ficha del negocio, pero no existe en el modelo
        actual.
    - entidad: Pago
      campo: PagadoEn
      estado: (plan)
      descripcion: |
        (plan) Aparece en la ficha del negocio, pero no existe en el modelo
        actual.

paths:
  /login:
    post:
      tags:
        - Sesión
      summary: Iniciar sesión y obtener un JWT
      description: |
        Ruta pública. Recibe `usuario` y `clave`, busca la cuenta y compara la
        contraseña con el hash bcrypt almacenado. Si el usuario no existe o la
        contraseña no coincide, devuelve el mismo `401 credenciales_invalidas`
        para no revelar cuentas existentes. El token dura una hora.

        Si faltan `usuario` o `clave`, el servidor no responde `422`: busca una
        cuenta con esos valores vacíos y termina en `401 credenciales_invalidas`.
      operationId: iniciarSesion
      security: []
      x-required-role: publico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudLogin'
            examples:
              ejemplo:
                summary: Credenciales ficticias
                value:
                  usuario: cliente.ejemplo
                  clave: clave-ficticia
      responses:
        '200':
          description: Token emitido correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaToken'
              examples:
                exito:
                  value:
                    ok: true
                    datos:
                      token: TOKEN_DE_EJEMPLO_NO_VALIDO
        '400':
          $ref: '#/components/responses/CuerpoMalformado'
        '401':
          description: Usuario o contraseña incorrectos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              examples:
                credenciales_invalidas:
                  value:
                    ok: false
                    error:
                      codigo: credenciales_invalidas
                      mensaje: usuario o contraseña incorrectos
        '404':
          $ref: '#/components/responses/RutaInexistente'
        '405':
          $ref: '#/components/responses/MetodoNoPermitido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /canchas:
    get:
      tags:
        - Canchas
      summary: Listar canchas visibles para la sesión
      description: |
        Exige una sesión válida. El rol decide el alcance y el query no puede
        ampliarlo:

        - `cliente`: recibe solo canchas con `Activa = true`. Puede enviar
          `administrador_id` para limitar el catálogo a las canchas activas de un
          administrador concreto.
        - `administrador`: recibe solo sus propias canchas, activas e inactivas.
          El query `administrador_id` se ignora.

        Cada cancha se devuelve con su arreglo `Horarios` precargado. Un rol
        distinto de los dos roles del negocio termina en `403 permiso_denegado`.
      operationId: listarCanchas
      x-required-role: cualquier_sesion
      parameters:
        - $ref: '#/components/parameters/AdministradorIDQuery'
      responses:
        '200':
          description: Lista de canchas permitidas para la sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaListaCanchas'
              examples:
                cliente:
                  value:
                    ok: true
                    datos:
                      - ID: 1
                        Nombre: Cancha El Golazo 1
                        Tipo: futbol_5
                        Direccion: Av. Los Shyris y Naciones Unidas
                        PrecioHora: 25
                        Activa: true
                        AdministradorID: 1
                        Horarios:
                          - ID: 1
                            CanchaID: 1
                            DiaSemana: sabado
                            HoraInicio: '18:00'
                            HoraFin: '19:00'
                            Activo: true
        '400':
          $ref: '#/components/responses/ParametroInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoDenegado'
        '404':
          $ref: '#/components/responses/RutaInexistente'
        '405':
          $ref: '#/components/responses/MetodoNoPermitido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

    post:
      tags:
        - Canchas
      summary: Crear una cancha para el administrador autenticado
      description: |
        Solo administrador. El cuerpo no incluye `AdministradorID`: el dueño se
        toma de la sesión y un valor enviado en el cuerpo se ignora. El servidor
        crea la cancha con `Activa = true`.

        Son obligatorios `Nombre`, `Tipo`, `Direccion` y un `PrecioHora` mayor
        que cero. `Tipo` debe ser `futbol_5`, `futbol_7` o `futbol_11`. Si el JSON
        está mal formado se responde `400`; si falta un dato o no es válido,
        `422`.
      operationId: crearCancha
      x-required-role: administrador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCrearCancha'
            examples:
              ejemplo:
                value:
                  Nombre: Cancha El Golazo 3
                  Tipo: futbol_7
                  Direccion: Av. Los Shyris y Naciones Unidas
                  PrecioHora: 35
      responses:
        '201':
          description: Cancha creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaCancha'
              examples:
                exito:
                  value:
                    ok: true
                    datos:
                      ID: 3
                      Nombre: Cancha El Golazo 3
                      Tipo: futbol_7
                      Direccion: Av. Los Shyris y Naciones Unidas
                      PrecioHora: 35
                      Activa: true
                      AdministradorID: 1
                      Horarios: null
        '400':
          $ref: '#/components/responses/CuerpoMalformado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoDenegado'
        '404':
          $ref: '#/components/responses/RutaInexistente'
        '405':
          $ref: '#/components/responses/MetodoNoPermitido'
        '422':
          description: Faltan datos obligatorios, el precio no es positivo o el tipo no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              examples:
                datos_invalidos:
                  value:
                    ok: false
                    error:
                      codigo: datos_invalidos
                      mensaje: nombre y dirección son obligatorios
                precio_invalido:
                  value:
                    ok: false
                    error:
                      codigo: datos_invalidos
                      mensaje: el precio por hora debe ser mayor que cero
                tipo_invalido:
                  value:
                    ok: false
                    error:
                      codigo: tipo_invalido
                      mensaje: el tipo de cancha no es válido
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /canchas/{id}:
    patch:
      tags:
        - Canchas
      summary: Actualizar una cancha propia
      description: |
        Solo administrador y solo si la cancha pertenece al administrador
        autenticado. Es una actualización parcial: se aplican los campos que
        lleguen con valor distinto de cero (`Nombre`, `Tipo`, `Direccion`,
        `PrecioHora > 0`) y `Activa` cuando el campo booleano está presente.

        No se puede cambiar el dueño ni borrar la cancha. Enviar `Nombre: ""`,
        `PrecioHora: 0` o cadenas vacías no limpia el valor anterior. `Tipo`, si
        llega no vacío, debe ser uno de los tres valores válidos.
      operationId: actualizarCancha
      x-required-role: administrador
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudActualizarCancha'
            examples:
              ejemplo:
                value:
                  Nombre: Cancha El Golazo 1 (renombrada)
                  PrecioHora: 28
                  Activa: false
      responses:
        '200':
          description: Cancha actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaCancha'
              examples:
                exito:
                  value:
                    ok: true
                    datos:
                      ID: 1
                      Nombre: Cancha El Golazo 1 (renombrada)
                      Tipo: futbol_5
                      Direccion: Av. Los Shyris y Naciones Unidas
                      PrecioHora: 28
                      Activa: false
                      AdministradorID: 1
                      Horarios: null
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoDenegado'
        '404':
          $ref: '#/components/responses/CanchaNoEncontrada'
        '405':
          $ref: '#/components/responses/MetodoNoPermitido'
        '422':
          description: El tipo de cancha no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              examples:
                tipo_invalido:
                  value:
                    ok: false
                    error:
                      codigo: tipo_invalido
                      mensaje: el tipo de cancha no es válido
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /reservas:
    post:
      tags:
        - Reservas
      summary: Crear una reserva para el cliente autenticado
      description: |
        Solo cliente. El dueño se deriva de la sesión: `ClienteID` no se acepta
        desde el cuerpo y se ignora si se envía. Son obligatorios `CanchaID`,
        `Fecha`, `HoraInicio` y `HoraFin`.

        La cancha debe existir y estar activa. Se busca un conflicto entre
        reservas no canceladas con la misma cancha, fecha y `HoraInicio`; el
        servidor no calcula solapamientos con `HoraFin`. La reserva nace en
        estado `pendiente` y no se crea ningún pago en esta operación.
      operationId: crearReserva
      x-required-role: cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCrearReserva'
            examples:
              ejemplo:
                value:
                  CanchaID: 1
                  Fecha: '2026-11-07'
                  HoraInicio: '18:00'
                  HoraFin: '19:00'
      responses:
        '201':
          description: Reserva creada en estado pendiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaReserva'
              examples:
                exito:
                  value:
                    ok: true
                    datos:
                      ID: 10
                      CanchaID: 1
                      ClienteID: 2
                      Fecha: '2026-11-07'
                      HoraInicio: '18:00'
                      HoraFin: '19:00'
                      Estado: pendiente
                      Pagos: null
        '400':
          $ref: '#/components/responses/CuerpoMalformado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoDenegado'
        '404':
          $ref: '#/components/responses/RutaInexistente'
        '405':
          $ref: '#/components/responses/MetodoNoPermitido'
        '409':
          description: Ya existe una reserva no cancelada para esa cancha, fecha y hora de inicio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              examples:
                horario_ocupado:
                  value:
                    ok: false
                    error:
                      codigo: horario_ocupado
                      mensaje: ya existe una reserva para esa cancha, fecha y hora
        '422':
          description: Faltan datos obligatorios o la cancha no existe/está inactiva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              examples:
                datos_invalidos:
                  value:
                    ok: false
                    error:
                      codigo: datos_invalidos
                      mensaje: cancha_id, fecha, hora_inicio y hora_fin son obligatorios
                cancha_invalida:
                  value:
                    ok: false
                    error:
                      codigo: cancha_invalida
                      mensaje: no existe una cancha activa con ese id
        '500':
          $ref: '#/components/responses/ErrorInterno'

    get:
      tags:
        - Reservas
      summary: Listar las reservas visibles para la sesión
      description: |
        Exige una sesión válida. El cliente solo ve sus propias reservas; el
        administrador solo ve las reservas de sus canchas. Cada reserva se
        devuelve con su arreglo `Pagos` precargado.

        `estado` filtra por coincidencia exacta y no se valida contra una lista.
        `cliente_id` solo se lee para el administrador y reduce dentro de sus
        canchas; para el cliente se ignora. Un `cliente_id` no numérico o menor
        que uno en el caso del administrador responde `400 id_invalido`.
      operationId: listarReservas
      x-required-role: cualquier_sesion
      parameters:
        - $ref: '#/components/parameters/EstadoQuery'
        - $ref: '#/components/parameters/ClienteIDQuery'
      responses:
        '200':
          description: Reservas permitidas para la sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaListaReservas'
              examples:
                exito:
                  value:
                    ok: true
                    datos:
                      - ID: 10
                        CanchaID: 1
                        ClienteID: 2
                        Fecha: '2026-11-07'
                        HoraInicio: '18:00'
                        HoraFin: '19:00'
                        Estado: pendiente
                        Pagos: []
        '400':
          $ref: '#/components/responses/ParametroInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoDenegado'
        '404':
          $ref: '#/components/responses/RutaInexistente'
        '405':
          $ref: '#/components/responses/MetodoNoPermitido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /reservas/{id}:
    get:
      tags:
        - Reservas
      summary: Obtener una reserva por id
      description: |
        Exige una sesión válida. El cliente solo puede leer una reserva cuyo
        `ClienteID` sea el suyo; el administrador solo una reserva de una cancha
        suya. Si la reserva existe pero no es accesible, responde
        `403 permiso_denegado`. Si no existe, `404 no_encontrado`. Devuelve la
        reserva con su arreglo `Pagos`.
      operationId: obtenerReserva
      x-required-role: cualquier_sesion
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Reserva encontrada y accesible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaReserva'
              examples:
                exito:
                  value:
                    ok: true
                    datos:
                      ID: 2
                      CanchaID: 1
                      ClienteID: 2
                      Fecha: '2026-10-04'
                      HoraInicio: '19:00'
                      HoraFin: '20:00'
                      Estado: confirmada
                      Pagos:
                        - ID: 1
                          ReservaID: 2
                          Tipo: sena
                          Monto: 7.5
                          Metodo: transferencia
                          ComprobanteURL: https://ejemplo.invalid/comprobante-1.jpg
                          Estado: verificado
        '400':
          $ref: '#/components/responses/IDInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoDenegado'
        '404':
          $ref: '#/components/responses/ReservaNoEncontrada'
        '405':
          $ref: '#/components/responses/MetodoNoPermitido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /reservas/{id}/estado:
    patch:
      tags:
        - Reservas
      summary: Cambiar el estado de una reserva
      description: |
        Solo administrador, y solo para reservas de sus propias canchas. El
        cuerpo exige `NuevoEstado`. El servidor valida que el estado exista y
        después que la transición esté permitida; una transición prohibida
        responde `422 transicion_invalida`.

        Transiciones permitidas (el servidor las acepta por esta ruta para el
        administrador):

        - `pendiente` → `pago_por_verificar` o `cancelada`
        - `pago_por_verificar` → `confirmada` o `cancelada`
        - `confirmada` → `jugada` o `cancelada`
        - `jugada` y `cancelada` no tienen salida

        Efectos reales: al pasar a `pago_por_verificar` se crea un `Pago` de tipo
        `sena`, monto igual al 30 % de `PrecioHora`, con `Metodo` y
        `ComprobanteURL` tomados del cuerpo (no se validan) y estado `pendiente`.
        Al pasar a `confirmada` se marca como `verificado` el pago de seña
        pendiente. Al pasar a `cancelada` no se modifica el estado de los pagos.
      operationId: cambiarEstadoReserva
      x-required-role: administrador
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCambiarEstado'
            examples:
              confirmar:
                value:
                  NuevoEstado: confirmada
              dejar_pago_por_verificar:
                value:
                  NuevoEstado: pago_por_verificar
                  Metodo: transferencia
                  ComprobanteURL: https://ejemplo.invalid/comprobante-1.jpg
      responses:
        '200':
          description: Reserva con su nuevo estado y sus pagos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaReserva'
              examples:
                exito:
                  value:
                    ok: true
                    datos:
                      ID: 10
                      CanchaID: 1
                      ClienteID: 2
                      Fecha: '2026-11-07'
                      HoraInicio: '18:00'
                      HoraFin: '19:00'
                      Estado: cancelada
                      Pagos:
                        - ID: 1
                          ReservaID: 10
                          Tipo: sena
                          Monto: 7.5
                          Metodo: transferencia
                          ComprobanteURL: https://ejemplo.invalid/comprobante-1.jpg
                          Estado: pendiente
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoDenegado'
        '404':
          $ref: '#/components/responses/ReservaNoEncontrada'
        '405':
          $ref: '#/components/responses/MetodoNoPermitido'
        '422':
          description: El estado no existe o la transición desde el estado actual no está permitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              examples:
                estado_invalido:
                  value:
                    ok: false
                    error:
                      codigo: estado_invalido
                      mensaje: ese estado no existe
                transicion_invalida:
                  value:
                    ok: false
                    error:
                      codigo: transicion_invalida
                      mensaje: no se puede pasar de jugada a cancelada
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /partidos:
    post:
      tags:
        - Partidos
      summary: Crear un partido a partir de una reserva confirmada
      description: |
        Solo cliente y solo para una reserva propia. La reserva debe existir y
        estar en estado `confirmada`. Cada reserva puede tener como máximo un
        partido. El servidor genera un `CodigoInvitacion` de seis caracteres y
        asigna `CreadoEn`; el cliente no elige ninguno de los dos.

        Son obligatorios `ReservaID`, `Nombre` y un `CupoMaximo` mayor que cero.
      operationId: crearPartido
      x-required-role: cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCrearPartido'
            examples:
              ejemplo:
                value:
                  ReservaID: 2
                  Nombre: Picadito del sábado
                  CupoMaximo: 10
      responses:
        '201':
          description: Partido creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPartido'
              examples:
                exito:
                  value:
                    ok: true
                    datos:
                      ID: 2
                      ReservaID: 2
                      Nombre: Picadito del sábado
                      CupoMaximo: 10
                      CodigoInvitacion: K3F9QZ
                      CreadoEn: '2026-11-07T12:00:00Z'
        '400':
          $ref: '#/components/responses/CuerpoMalformado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoDenegado'
        '404':
          $ref: '#/components/responses/ReservaNoEncontrada'
        '405':
          $ref: '#/components/responses/MetodoNoPermitido'
        '409':
          description: Ya existe un partido para esa reserva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              examples:
                partido_existente:
                  value:
                    ok: false
                    error:
                      codigo: partido_existente
                      mensaje: ya existe un partido para esa reserva
        '422':
          description: Faltan datos o la reserva no está confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              examples:
                datos_invalidos:
                  value:
                    ok: false
                    error:
                      codigo: datos_invalidos
                      mensaje: reserva_id, nombre y cupo_maximo son obligatorios
                reserva_no_confirmada:
                  value:
                    ok: false
                    error:
                      codigo: reserva_no_confirmada
                      mensaje: solo se puede crear un partido desde una reserva confirmada
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /partidos/{id}:
    get:
      tags:
        - Partidos
      summary: Ver el detalle de un partido y sus cupos
      description: |
        Exige un token válido, pero no resuelve el vínculo de negocio ni aplica
        una regla de propiedad: cualquier token aceptado por el guardia puede
        consultar cualquier partido. Devuelve un objeto con `partido`,
        `inscriptos` y `cupos_restantes`.

        Si el partido no existe, responde `404 no_encontrado`. Un fallo de base
        de datos al leer el partido o al contar sus inscripciones responde
        `500 error_base`.
      operationId: obtenerPartido
      x-required-role: cualquier_sesion
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Detalle del partido y conteo de inscripciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaDetallePartido'
              examples:
                exito:
                  value:
                    ok: true
                    datos:
                      partido:
                        ID: 1
                        ReservaID: 2
                        Nombre: Picadito del sábado
                        CupoMaximo: 10
                        CodigoInvitacion: ABC123
                        CreadoEn: '2026-10-04T10:00:00Z'
                      inscriptos: 2
                      cupos_restantes: 8
        '400':
          $ref: '#/components/responses/IDInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/PartidoNoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoNoPermitido'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /partidos/{id}/inscripciones:
    post:
      tags:
        - Inscripciones
      summary: Inscribir al cliente autenticado en un partido
      description: |
        Solo cliente. El jugador se deriva de la sesión: `JugadorID` no se acepta
        desde el cuerpo y se ignora si se envía. El cuerpo exige
        `CodigoInvitacion`, que debe coincidir exactamente con el del partido.

        No se puede inscribir dos veces el mismo jugador ni superar
        `CupoMaximo`. No se comprueba que el cliente sea distinto del creador del
        partido; cualquier cliente con el código puede inscribirse.
      operationId: crearInscripcion
      x-required-role: cliente
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCrearInscripcion'
            examples:
              ejemplo:
                value:
                  CodigoInvitacion: ABC123
      responses:
        '201':
          description: Inscripción creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaInscripcion'
              examples:
                exito:
                  value:
                    ok: true
                    datos:
                      ID: 3
                      PartidoID: 1
                      JugadorID: 2
                      CreadoEn: '2026-11-07T12:05:00Z'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PermisoDenegado'
        '404':
          $ref: '#/components/responses/PartidoNoEncontrado'
        '405':
          $ref: '#/components/responses/MetodoNoPermitido'
        '409':
          description: El jugador ya está inscrito o el partido está lleno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              examples:
                ya_inscripto:
                  value:
                    ok: false
                    error:
                      codigo: ya_inscripto
                      mensaje: el jugador ya está inscrito en este partido
                partido_lleno:
                  value:
                    ok: false
                    error:
                      codigo: partido_lleno
                      mensaje: el partido ya no tiene cupos disponibles
        '422':
          description: Falta el código o el código no coincide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
              examples:
                datos_invalidos:
                  value:
                    ok: false
                    error:
                      codigo: datos_invalidos
                      mensaje: codigo_invitacion es obligatorio
                codigo_invalido:
                  value:
                    ok: false
                    error:
                      codigo: codigo_invalido
                      mensaje: el código de invitación no es válido
        '500':
          $ref: '#/components/responses/ErrorInterno'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT firmado con HS256 y enviado como `Authorization: Bearer <jwt>`.
        Dura una hora. El token ausente, vencido o inválido responde `401`.

  parameters:
    ID:
      name: id
      in: path
      required: true
      description: Identificador positivo del recurso.
      schema:
        type: integer
        format: int64
        minimum: 1
    AdministradorIDQuery:
      name: administrador_id
      in: query
      required: false
      description: |
        Solo se aplica al rol cliente: limita el catálogo a las canchas activas
        del administrador indicado. Para el rol administrador se ignora. Un valor
        no numérico o menor que uno responde `400 id_invalido`.
      schema:
        type: integer
        format: int64
        minimum: 1
    EstadoQuery:
      name: estado
      in: query
      required: false
      description: |
        Filtro por coincidencia exacta del estado. El servidor no valida el valor
        contra la lista de estados: un valor desconocido simplemente no coincide.
      schema:
        type: string
      examples:
        pendiente:
          value: pendiente
        confirmada:
          value: confirmada
    ClienteIDQuery:
      name: cliente_id
      in: query
      required: false
      description: |
        Solo se aplica al rol administrador y reduce el resultado a las reservas
        de ese cliente dentro de las canchas del administrador. Para el rol
        cliente se ignora. Un valor no numérico o menor que uno responde
        `400 id_invalido` cuando lo procesa el administrador.
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    ErrorRespuesta:
      type: object
      additionalProperties: false
      required:
        - ok
        - error
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          additionalProperties: false
          required:
            - codigo
            - mensaje
          properties:
            codigo:
              type: string
              description: Código estable de la envoltura de error.
            mensaje:
              type: string
              description: Mensaje legible para la persona que consume la API.

    Token:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: JWT HS256 ficticio en los ejemplos; no usar un token real en la documentación.

    RespuestaToken:
      type: object
      required:
        - ok
        - datos
      properties:
        ok:
          type: boolean
          const: true
        datos:
          $ref: '#/components/schemas/Token'

    Horario:
      type: object
      required:
        - ID
        - CanchaID
        - DiaSemana
        - HoraInicio
        - HoraFin
        - Activo
      properties:
        ID:
          type: integer
          format: int64
          minimum: 1
        CanchaID:
          type: integer
          format: int64
          minimum: 1
        DiaSemana:
          type: string
          enum:
            - lunes
            - martes
            - miercoles
            - jueves
            - viernes
            - sabado
            - domingo
        HoraInicio:
          type: string
          description: Cadena de hora; el modelo usa el formato HH:MM.
          examples:
            - '18:00'
        HoraFin:
          type: string
          description: Cadena de hora; el modelo usa el formato HH:MM.
          examples:
            - '19:00'
        Activo:
          type: boolean

    Cancha:
      type: object
      required:
        - ID
        - Nombre
        - Tipo
        - Direccion
        - PrecioHora
        - Activa
        - AdministradorID
        - Horarios
      properties:
        ID:
          type: integer
          format: int64
          minimum: 1
        Nombre:
          type: string
        Tipo:
          type: string
          enum:
            - futbol_5
            - futbol_7
            - futbol_11
        Direccion:
          type: string
        PrecioHora:
          type: number
          format: double
          exclusiveMinimum: 0
        Activa:
          type: boolean
        AdministradorID:
          type: integer
          format: int64
          minimum: 1
        Horarios:
          description: |
            Arreglo de horarios precargado en los listados. Puede ser `null`
            cuando la operación devuelve una cancha recién creada o guardada sin
            precargar la asociación.
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/Horario'

    RespuestaCancha:
      type: object
      required:
        - ok
        - datos
      properties:
        ok:
          type: boolean
          const: true
        datos:
          $ref: '#/components/schemas/Cancha'

    RespuestaListaCanchas:
      type: object
      required:
        - ok
        - datos
      properties:
        ok:
          type: boolean
          const: true
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Cancha'

    Pago:
      type: object
      required:
        - ID
        - ReservaID
        - Tipo
        - Monto
        - Metodo
        - ComprobanteURL
        - Estado
      properties:
        ID:
          type: integer
          format: int64
          minimum: 1
        ReservaID:
          type: integer
          format: int64
          minimum: 1
        Tipo:
          type: string
          enum:
            - sena
            - saldo
        Monto:
          type: number
          format: double
        Metodo:
          type: string
          description: |
            La ficha propone transferencia, efectivo o tarjeta, pero el servidor
            no valida este campo al crear el pago de seña.
          examples:
            - transferencia
        ComprobanteURL:
          type: string
          description: Cadena tomada del cuerpo; el servidor no valida el formato.
        Estado:
          type: string
          enum:
            - pendiente
            - verificado
            - rechazado

    Reserva:
      type: object
      required:
        - ID
        - CanchaID
        - ClienteID
        - Fecha
        - HoraInicio
        - HoraFin
        - Estado
        - Pagos
      properties:
        ID:
          type: integer
          format: int64
          minimum: 1
        CanchaID:
          type: integer
          format: int64
          minimum: 1
        ClienteID:
          type: integer
          format: int64
          minimum: 1
        Fecha:
          type: string
          description: Cadena de fecha; el modelo usa el formato YYYY-MM-DD. No se valida el calendario.
          examples:
            - '2026-11-07'
        HoraInicio:
          type: string
          description: Cadena de hora; el modelo usa el formato HH:MM. No se valida el formato.
        HoraFin:
          type: string
          description: Cadena de hora; el modelo usa el formato HH:MM. No se valida el formato.
        Estado:
          type: string
          enum:
            - pendiente
            - pago_por_verificar
            - confirmada
            - jugada
            - cancelada
        Pagos:
          description: |
            Arreglo de pagos precargado en consultas. Puede ser `null` en la
            respuesta de una reserva recién creada.
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/Pago'

    RespuestaReserva:
      type: object
      required:
        - ok
        - datos
      properties:
        ok:
          type: boolean
          const: true
        datos:
          $ref: '#/components/schemas/Reserva'

    RespuestaListaReservas:
      type: object
      required:
        - ok
        - datos
      properties:
        ok:
          type: boolean
          const: true
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Reserva'

    Partido:
      type: object
      required:
        - ID
        - ReservaID
        - Nombre
        - CupoMaximo
        - CodigoInvitacion
        - CreadoEn
      properties:
        ID:
          type: integer
          format: int64
          minimum: 1
        ReservaID:
          type: integer
          format: int64
          minimum: 1
        Nombre:
          type: string
        CupoMaximo:
          type: integer
          format: int64
          minimum: 1
        CodigoInvitacion:
          type: string
          description: Código de seis caracteres generado por el servidor.
        CreadoEn:
          type: string
          format: date-time
          description: Marca de tiempo en RFC 3339 generada por Go.

    RespuestaPartido:
      type: object
      required:
        - ok
        - datos
      properties:
        ok:
          type: boolean
          const: true
        datos:
          $ref: '#/components/schemas/Partido'

    RespuestaDetallePartido:
      type: object
      required:
        - ok
        - datos
      properties:
        ok:
          type: boolean
          const: true
        datos:
          type: object
          additionalProperties: false
          required:
            - partido
            - inscriptos
            - cupos_restantes
          properties:
            partido:
              $ref: '#/components/schemas/Partido'
            inscriptos:
              type: integer
              format: int64
              minimum: 0
            cupos_restantes:
              type: integer
              format: int64

    Inscripcion:
      type: object
      required:
        - ID
        - PartidoID
        - JugadorID
        - CreadoEn
      properties:
        ID:
          type: integer
          format: int64
          minimum: 1
        PartidoID:
          type: integer
          format: int64
          minimum: 1
        JugadorID:
          type: integer
          format: int64
          minimum: 1
        CreadoEn:
          type: string
          format: date-time

    RespuestaInscripcion:
      type: object
      required:
        - ok
        - datos
      properties:
        ok:
          type: boolean
          const: true
        datos:
          $ref: '#/components/schemas/Inscripcion'

    SolicitudLogin:
      type: object
      required:
        - usuario
        - clave
      properties:
        usuario:
          type: string
          description: Nombre de la cuenta, no el email ni el ID.
        clave:
          type: string
          format: password
          description: Contraseña en claro solo en tránsito; el servidor guarda un hash bcrypt.

    SolicitudCrearCancha:
      type: object
      required:
        - Nombre
        - Tipo
        - Direccion
        - PrecioHora
      properties:
        Nombre:
          type: string
          minLength: 1
        Tipo:
          type: string
          enum:
            - futbol_5
            - futbol_7
            - futbol_11
        Direccion:
          type: string
          minLength: 1
        PrecioHora:
          type: number
          format: double
          exclusiveMinimum: 0
      description: |
        `AdministradorID` y `Activa` no se leen del cuerpo: el dueño sale de la
        sesión y el servidor crea la cancha activa.

    SolicitudActualizarCancha:
      type: object
      description: |
        Actualización parcial. Los campos son opcionales; los valores vacíos o
        cero se ignoran, salvo `Activa`, que se aplica si está presente.
      properties:
        Nombre:
          type: string
        Tipo:
          type: string
          enum:
            - futbol_5
            - futbol_7
            - futbol_11
        Direccion:
          type: string
        PrecioHora:
          type: number
          format: double
          description: Solo se aplica si es mayor que cero.
        Activa:
          type: boolean

    SolicitudCrearReserva:
      type: object
      required:
        - CanchaID
        - Fecha
        - HoraInicio
        - HoraFin
      properties:
        CanchaID:
          type: integer
          format: int64
          minimum: 1
        Fecha:
          type: string
          minLength: 1
          description: El servidor solo comprueba que no esté vacía; el formato convenido es YYYY-MM-DD.
        HoraInicio:
          type: string
          minLength: 1
          description: El servidor solo comprueba que no esté vacía; el formato convenido es HH:MM.
        HoraFin:
          type: string
          minLength: 1
          description: El servidor solo comprueba que no esté vacía; el formato convenido es HH:MM.
      description: |
        `ClienteID` no se lee del cuerpo: el dueño sale de la sesión.

    SolicitudCambiarEstado:
      type: object
      required:
        - NuevoEstado
      properties:
        NuevoEstado:
          type: string
          enum:
            - pendiente
            - pago_por_verificar
            - confirmada
            - jugada
            - cancelada
        Metodo:
          type: string
          description: Solo se usa al pasar a pago_por_verificar; el servidor no valida el valor.
        ComprobanteURL:
          type: string
          description: Solo se usa al pasar a pago_por_verificar; el servidor no valida el formato.

    SolicitudCrearPartido:
      type: object
      required:
        - ReservaID
        - Nombre
        - CupoMaximo
      properties:
        ReservaID:
          type: integer
          format: int64
          minimum: 1
        Nombre:
          type: string
          minLength: 1
        CupoMaximo:
          type: integer
          format: int64
          minimum: 1

    SolicitudCrearInscripcion:
      type: object
      required:
        - CodigoInvitacion
      properties:
        CodigoInvitacion:
          type: string
          minLength: 1
      description: |
        `JugadorID` no se lee del cuerpo: el jugador sale de la sesión.

  responses:
    CuerpoMalformado:
      description: El cuerpo no es JSON válido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
          examples:
            cuerpo_malformado:
              value:
                ok: false
                error:
                  codigo: cuerpo_malformado
                  mensaje: el cuerpo debe ser JSON

    IDInvalido:
      description: El id de la ruta no es un entero positivo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
          examples:
            id_invalido:
              value:
                ok: false
                error:
                  codigo: id_invalido
                  mensaje: el id debe ser un entero positivo

    ParametroInvalido:
      description: Un parámetro de query numérico no es un entero positivo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
          examples:
            administrador_id:
              value:
                ok: false
                error:
                  codigo: id_invalido
                  mensaje: el administrador_id debe ser un entero positivo
            cliente_id:
              value:
                ok: false
                error:
                  codigo: id_invalido
                  mensaje: el cliente_id debe ser un entero positivo

    SolicitudInvalida:
      description: El id de la ruta o el cuerpo JSON no son válidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
          examples:
            id_invalido:
              value:
                ok: false
                error:
                  codigo: id_invalido
                  mensaje: el id debe ser un entero positivo
            cuerpo_malformado:
              value:
                ok: false
                error:
                  codigo: cuerpo_malformado
                  mensaje: el cuerpo debe ser JSON

    NoAutenticado:
      description: Falta el token, está vencido o no es un JWT válido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
          examples:
            falta_token:
              value:
                ok: false
                error:
                  codigo: falta_token
                  mensaje: 'falta el token: inicie sesión en POST /login'
            token_vencido:
              value:
                ok: false
                error:
                  codigo: token_vencido
                  mensaje: 'el token está vencido: inicie sesión otra vez'
            token_invalido:
              value:
                ok: false
                error:
                  codigo: token_invalido
                  mensaje: el token no es válido

    PermisoDenegado:
      description: |
        El rol no tiene permiso, la cuenta no tiene vínculo de negocio o el
        recurso pertenece a otro usuario u otra cancha.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
          examples:
            rol:
              value:
                ok: false
                error:
                  codigo: permiso_denegado
                  mensaje: su rol no tiene permiso para esta acción
            sin_vinculo:
              value:
                ok: false
                error:
                  codigo: cuenta_sin_vinculo
                  mensaje: la cuenta no está vinculada a un usuario de negocio
            recurso_ajeno:
              value:
                ok: false
                error:
                  codigo: permiso_denegado
                  mensaje: la reserva no es suya ni de sus canchas

    RutaInexistente:
      description: |
        La ruta solicitada no está registrada. El router responde con esta
        envoltura antes de llegar a cualquier manejador de negocio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
          examples:
            ruta_inexistente:
              value:
                ok: false
                error:
                  codigo: ruta_inexistente
                  mensaje: la ruta no existe

    CanchaNoEncontrada:
      description: |
        No existe una cancha con ese id (`no_encontrado`). Si la ruta no está
        registrada, el router responde `ruta_inexistente`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
          examples:
            no_encontrado:
              value:
                ok: false
                error:
                  codigo: no_encontrado
                  mensaje: no existe una cancha con ese id
            ruta_inexistente:
              value:
                ok: false
                error:
                  codigo: ruta_inexistente
                  mensaje: la ruta no existe

    ReservaNoEncontrada:
      description: |
        No existe una reserva con ese id (`no_encontrado`). Si la ruta no está
        registrada, el router responde `ruta_inexistente`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
          examples:
            no_encontrado:
              value:
                ok: false
                error:
                  codigo: no_encontrado
                  mensaje: no existe una reserva con ese id
            ruta_inexistente:
              value:
                ok: false
                error:
                  codigo: ruta_inexistente
                  mensaje: la ruta no existe

    PartidoNoEncontrado:
      description: |
        No existe un partido con ese id (`no_encontrado`). Si la ruta no está
        registrada, el router responde `ruta_inexistente`. Los fallos de base de
        datos no se confunden con este `404`: el manejador responde
        `500 error_base`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
          examples:
            no_encontrado:
              value:
                ok: false
                error:
                  codigo: no_encontrado
                  mensaje: no existe un partido con ese id
            ruta_inexistente:
              value:
                ok: false
                error:
                  codigo: ruta_inexistente
                  mensaje: la ruta no existe

    MetodoNoPermitido:
      description: La ruta existe, pero el método HTTP no está registrado para ella.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
          examples:
            metodo_no_permitido:
              value:
                ok: false
                error:
                  codigo: metodo_no_permitido
                  mensaje: el método no está permitido en esta ruta

    ErrorInterno:
      description: |
        Fallo inesperado del servidor o de la base de datos. `error_base` lo usan
        los manejadores que no pudieron persistir o leer; `error_interno` lo usa
        el middleware que atrapa un pánico. Nunca se exponen detalles internos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
          examples:
            error_base:
              value:
                ok: false
                error:
                  codigo: error_base
                  mensaje: no se pudo guardar la operación
            error_interno:
              value:
                ok: false
                error:
                  codigo: error_interno
                  mensaje: ocurrió un error inesperado
