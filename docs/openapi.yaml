openapi: 3.1.0
info:
  title: ServA · Canchas Sintéticas
  version: 2.0.0
  summary: API asíncrona con Saga Coreografía.
  license:
    name: MIT
    url: https://opensource.org/license/mit
  description: |
    Servidor HTTP para reservar canchas sintéticas, cobrar la seña y organizar
    partidos. Las operaciones que inician pasos de la saga responden `202
    Accepted` con un `saga_id`; el cliente consulta `GET /sagas/{id}` para
    conocer el resultado.

    La fuente de verdad es el código de este repositorio. La documentación
    anterior está en `docs/legacy/` y no debe usarse para implementar.
servers:
  - url: https://api.serva.invalid
    description: Servidor de ejemplo; en local use http://localhost:8080.
security:
  - bearerAuth: []
tags:
  - name: Sesión
    description: Autenticación y tokens.
  - name: Canchas
    description: Catálogo de canchas.
  - name: Reservas
    description: Ciclo de vida de una reserva.
  - name: Sagas
    description: Consulta del avance de una saga.
  - name: Partidos
    description: Partidos e inscripciones.

paths:
  /login:
    post:
      tags: [Sesión]
      summary: Iniciar sesión
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginEntrada'
      responses:
        '200':
          description: Token emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkToken'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          description: Usuario o contraseña incorrectos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          $ref: '#/components/responses/ErrorInterno'

  /canchas:
    get:
      tags: [Canchas]
      summary: Listar canchas visibles para la sesión
      operationId: listarCanchas
      parameters:
        - name: administrador_id
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Lista de canchas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkCanchaLista'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
    post:
      tags: [Canchas]
      summary: Crear una cancha
      operationId: crearCancha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanchaEntrada'
      responses:
        '201':
          description: Cancha creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkCancha'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/NoProcesable'

  /canchas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Canchas]
      summary: Editar una cancha propia
      operationId: actualizarCancha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanchaActualizar'
      responses:
        '200':
          description: Cancha actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkCancha'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoProcesable'

  /reservas:
    get:
      tags: [Reservas]
      summary: Listar reservas visibles para la sesión
      operationId: listarReservas
      parameters:
        - name: estado
          in: query
          schema:
            $ref: '#/components/schemas/EstadoReserva'
        - name: cliente_id
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Lista de reservas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkReservaLista'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
    post:
      tags: [Reservas]
      summary: Crear una reserva
      operationId: crearReserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaEntrada'
      responses:
        '201':
          description: Reserva creada. El evento ReservaCreada queda en el outbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkReserva'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/NoProcesable'

  /reservas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Reservas]
      summary: Obtener una reserva con sus pagos
      operationId: obtenerReserva
      responses:
        '200':
          description: Reserva encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkReserva'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /reservas/{id}/estado:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Reservas]
      summary: Iniciar un paso de la saga de la reserva
      description: |
        Valida rol, propiedad y transición de forma síncrona. Si se acepta,
        publica el hecho correspondiente y responde `202` con la saga. El
        cambio de estado real lo aplica el consumidor de `reservas`.
      operationId: cambiarEstadoReserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarEstadoEntrada'
      responses:
        '202':
          description: Paso aceptado; consultar la saga.
          headers:
            Location:
              schema:
                type: string
              description: Ruta de la saga, por ejemplo `/sagas/reserva-7`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkAceptado'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/NoProcesable'

  /sagas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador determinista, por ejemplo `reserva-7`.
        schema:
          type: string
          pattern: '^reserva-[0-9]+$'
    get:
      tags: [Sagas]
      summary: Consultar el estado de una saga
      operationId: obtenerSaga
      responses:
        '200':
          description: Proyección de la saga.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkSaga'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /partidos:
    post:
      tags: [Partidos]
      summary: Solicitar la creación de un partido
      description: |
        Valida que la reserva exista, sea del cliente y esté confirmada.
        Responde `202`; el partido lo crea la saga cuando `reservas` publica
        `ReservaValidadaParaPartido`.
      operationId: crearPartido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartidoEntrada'
      responses:
        '202':
          description: Solicitud aceptada; consultar la saga.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkAceptado'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/NoProcesable'

  /partidos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Partidos]
      summary: Obtener un partido
      operationId: obtenerPartido
      responses:
        '200':
          description: Partido encontrado con el conteo de inscriptos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkPartidoDetalle'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /partidos/{id}/inscripciones:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Partidos]
      summary: Inscribirse en un partido
      operationId: crearInscripcion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InscripcionEntrada'
      responses:
        '201':
          description: Inscripción creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkInscripcion'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/NoProcesable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    SolicitudInvalida:
      description: Cuerpo o parámetros inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
    NoAutorizado:
      description: Falta el token o es inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
    Prohibido:
      description: Rol o propiedad incorrectos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
    NoEncontrado:
      description: El recurso no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
    Conflicto:
      description: Conflicto con el estado actual del recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
    NoProcesable:
      description: Datos o transición no válidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
    ErrorInterno:
      description: Falla inesperada del servidor o de la base de datos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'

  schemas:
    LoginEntrada:
      type: object
      required: [usuario, clave]
      properties:
        usuario:
          type: string
          example: ana
        clave:
          type: string
          format: password
          example: ana-2026

    Token:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: JWT firmado.

    OkToken:
      type: object
      required: [ok, datos]
      properties:
        ok:
          type: boolean
          enum: [true]
        datos:
          $ref: '#/components/schemas/Token'

    ErrorDetalle:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          example: transicion_invalida
        mensaje:
          type: string
          example: no se puede pasar de jugada a cancelada

    ErrorRespuesta:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          $ref: '#/components/schemas/ErrorDetalle'

    CanchaEntrada:
      type: object
      required: [Nombre, Tipo, Direccion, PrecioHora]
      properties:
        Nombre:
          type: string
        Tipo:
          type: string
          enum: [futbol_5, futbol_7, futbol_11]
        Direccion:
          type: string
        PrecioHora:
          type: number
          exclusiveMinimum: 0

    CanchaActualizar:
      type: object
      properties:
        Nombre:
          type: string
        Tipo:
          type: string
          enum: [futbol_5, futbol_7, futbol_11]
        Direccion:
          type: string
        PrecioHora:
          type: number
          exclusiveMinimum: 0
        Activa:
          type: [boolean, 'null']

    Horario:
      type: object
      properties:
        ID:
          type: integer
        CanchaID:
          type: integer
        DiaSemana:
          type: string
          enum: [lunes, martes, miercoles, jueves, viernes, sabado, domingo]
        HoraInicio:
          type: string
          pattern: '^[0-2][0-9]:[0-5][0-9]$'
        HoraFin:
          type: string
          pattern: '^[0-2][0-9]:[0-5][0-9]$'
        Activo:
          type: boolean

    Cancha:
      type: object
      properties:
        ID:
          type: integer
        Nombre:
          type: string
        Tipo:
          type: string
        Direccion:
          type: string
        PrecioHora:
          type: number
        Activa:
          type: boolean
        AdministradorID:
          type: integer
        Horarios:
          type: array
          items:
            $ref: '#/components/schemas/Horario'

    OkCancha:
      type: object
      required: [ok, datos]
      properties:
        ok:
          type: boolean
          enum: [true]
        datos:
          $ref: '#/components/schemas/Cancha'

    OkCanchaLista:
      type: object
      required: [ok, datos]
      properties:
        ok:
          type: boolean
          enum: [true]
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Cancha'

    EstadoReserva:
      type: string
      enum: [pendiente, pago_por_verificar, confirmada, jugada, cancelada]

    Pago:
      type: object
      properties:
        ID:
          type: integer
        ReservaID:
          type: integer
        Tipo:
          type: string
          enum: [sena, saldo]
        Monto:
          type: number
        Metodo:
          type: string
          enum: [transferencia, efectivo, tarjeta]
        ComprobanteURL:
          type: string
        Estado:
          type: string
          enum: [pendiente, verificado, anulado]

    ReservaEntrada:
      type: object
      required: [CanchaID, Fecha, HoraInicio, HoraFin]
      properties:
        CanchaID:
          type: integer
          minimum: 1
        Fecha:
          type: string
          example: '2026-10-21'
        HoraInicio:
          type: string
          example: '18:00'
        HoraFin:
          type: string
          example: '19:00'

    Reserva:
      type: object
      properties:
        ID:
          type: integer
        CanchaID:
          type: integer
        ClienteID:
          type: integer
        Fecha:
          type: string
        HoraInicio:
          type: string
        HoraFin:
          type: string
        Estado:
          $ref: '#/components/schemas/EstadoReserva'
        Pagos:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Pago'

    OkReserva:
      type: object
      required: [ok, datos]
      properties:
        ok:
          type: boolean
          enum: [true]
        datos:
          $ref: '#/components/schemas/Reserva'

    OkReservaLista:
      type: object
      required: [ok, datos]
      properties:
        ok:
          type: boolean
          enum: [true]
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Reserva'

    CambiarEstadoEntrada:
      type: object
      required: [NuevoEstado]
      properties:
        NuevoEstado:
          type: string
          enum: [pendiente, pago_por_verificar, confirmada, jugada, cancelada]
        Metodo:
          type: string
          enum: [transferencia, efectivo, tarjeta]
        ComprobanteURL:
          type: string

    Aceptado:
      type: object
      required: [saga_id, estado, paso]
      properties:
        saga_id:
          type: string
          example: reserva-7
        estado:
          type: string
          enum: [iniciada, en_proceso, completada, compensando, compensada, cancelada, fallida]
        paso:
          type: string
          example: iniciada

    OkAceptado:
      type: object
      required: [ok, datos]
      properties:
        ok:
          type: boolean
          enum: [true]
        datos:
          $ref: '#/components/schemas/Aceptado'

    Saga:
      type: object
      properties:
        id:
          type: string
          example: reserva-7
        tipo:
          type: string
          example: ciclo_reserva
        agregado_id:
          type: integer
        estado:
          type: string
          enum: [iniciada, en_proceso, completada, compensando, compensada, cancelada, fallida]
        paso:
          type: string
        ultimo_evento_id:
          type: string
        ultimo_evento_en:
          type: string
          format: date-time
        error:
          type: string
        recurso_id:
          type: integer
        creada_en:
          type: string
          format: date-time
        actualizada_en:
          type: string
          format: date-time

    OkSaga:
      type: object
      required: [ok, datos]
      properties:
        ok:
          type: boolean
          enum: [true]
        datos:
          $ref: '#/components/schemas/Saga'

    PartidoEntrada:
      type: object
      required: [ReservaID, Nombre, CupoMaximo]
      properties:
        ReservaID:
          type: integer
          minimum: 1
        Nombre:
          type: string
        CupoMaximo:
          type: integer
          minimum: 1

    Partido:
      type: object
      properties:
        ID:
          type: integer
        ReservaID:
          type: integer
        Nombre:
          type: string
        CupoMaximo:
          type: integer
        CodigoInvitacion:
          type: string
        CreadoEn:
          type: string
          format: date-time
        Estado:
          type: string
          enum: [activo, cancelado]

    PartidoDetalle:
      type: object
      required: [partido, inscriptos, cupos_restantes]
      properties:
        partido:
          $ref: '#/components/schemas/Partido'
        inscriptos:
          type: integer
          minimum: 0
        cupos_restantes:
          type: integer

    OkPartidoDetalle:
      type: object
      required: [ok, datos]
      properties:
        ok:
          type: boolean
          enum: [true]
        datos:
          $ref: '#/components/schemas/PartidoDetalle'

    InscripcionEntrada:
      type: object
      required: [CodigoInvitacion]
      properties:
        CodigoInvitacion:
          type: string

    Inscripcion:
      type: object
      properties:
        ID:
          type: integer
        PartidoID:
          type: integer
        JugadorID:
          type: integer
        CreadoEn:
          type: string
          format: date-time

    OkInscripcion:
      type: object
      required: [ok, datos]
      properties:
        ok:
          type: boolean
          enum: [true]
        datos:
          $ref: '#/components/schemas/Inscripcion'
